<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ML System Design Bible</title>
<meta name="description" content="A FAANG-grade ML System Design learning bible & interview prep guide." />
<link id="hljs-dark"  rel="stylesheet" href="vendor/hljs-dark.css" />
<link id="hljs-light" rel="stylesheet" href="vendor/hljs-light.css" disabled />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="progress"></div>

<header id="topbar">
  <button id="menu-btn" class="icon-btn" title="Toggle navigation" aria-label="Toggle navigation">☰</button>
  <a href="#00-index" class="brand">
    <span class="brand-mark">🧠</span>
    <span class="brand-text">
      <strong>ML System Design Bible</strong>
      <em>Foundations → Staff Engineer · 2026 edition</em>
    </span>
  </a>
  <div class="topbar-spacer"></div>
  <button id="search-btn" class="pill-btn" title="Search (press /)">
    <span>🔍</span> Search <kbd>/</kbd>
  </button>
  <button id="gallery-btn" class="pill-btn" title="Browse all architecture diagrams">
    <span>📊</span> Diagram Gallery
  </button>
  <button id="theme-btn" class="icon-btn" title="Toggle light / dark">☀️</button>
</header>

<div id="layout">
  <aside id="sidebar"><nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="legend-title">Callout legend</div>
      <div class="legend"><span class="lg lg-staff">🎯</span> Staff insight</div>
      <div class="legend"><span class="lg lg-warn">⚠️</span> Common mistake</div>
      <div class="legend"><span class="lg lg-tip">💡</span> Interview tip</div>
    </div>
  </aside>

  <main id="main">
    <article id="content" class="markdown-body">
      <div class="loading">Loading chapter…</div>
    </article>
    <nav id="prevnext"></nav>
    <footer id="docfoot">
      ML System Design Bible · generated as a personal study handbook ·
      <span id="foot-date"></span>
    </footer>
  </main>

  <aside id="toc-wrap">
    <div class="toc-head">On this page</div>
    <nav id="toc"></nav>
  </aside>
</div>

<div id="scrim" class="overlay-scrim" hidden></div>

<!-- Search overlay -->
<div id="search-modal" class="modal" hidden role="dialog" aria-label="Search">
  <div class="search-box">
    <input id="search-input" type="text" placeholder="Search every chapter…" autocomplete="off" spellcheck="false" />
    <button class="icon-btn" id="search-close" aria-label="Close">✕</button>
  </div>
  <div id="search-results" class="search-results"></div>
  <div class="search-hint"><kbd>↑</kbd><kbd>↓</kbd> navigate · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</div>
</div>

<!-- Diagram gallery overlay -->
<div id="gallery-modal" class="modal modal-wide" hidden role="dialog" aria-label="Diagram gallery">
  <div class="gallery-head">
    <strong>📊 Architecture Diagram Gallery</strong>
    <select id="gallery-filter" aria-label="Filter diagrams by chapter"></select>
    <span id="gallery-count" class="muted"></span>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="gallery-close" aria-label="Close">✕</button>
  </div>
  <div id="gallery-grid" class="gallery-grid"></div>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="docs-bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
